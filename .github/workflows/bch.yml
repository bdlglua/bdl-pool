name: Pool API and BCH relay checks

on:
  pull_request:
    paths: ["bch/**", "monitoring/**", "api/**", "services/**", ".github/workflows/bch.yml"]
  push:
    branches: [main]
    paths: ["bch/**", "monitoring/**", "api/**", "services/**", ".github/workflows/bch.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-services:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
      - run: cargo fmt --manifest-path services/Cargo.toml -- --check
      - run: cargo clippy --locked --manifest-path services/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path services/Cargo.toml
      - run: cargo build --locked --release --manifest-path services/Cargo.toml
      - run: bash -n api/install.sh monitoring/publish.sh
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: python3 -m unittest discover -s api -p 'test_*.py'
      - run: python3 -m unittest discover -s monitoring -p 'test_*.py'
      - run: python3 -m unittest discover -s bch -p 'test_*.py'
      - run: bash -n bch/build.sh bch/install.sh monitoring/install-openport.sh
