<section class="connection-section wrap category-page" id="connexion" aria-labelledby="connection-title">
      <div class="section-heading"><div><h1 id="connection-title">Connexion</h1></div></div>
      <div class="connection-grid">
        <div class="panel endpoint-panel"><div class="panel-heading"><h3>Stratum</h3></div><div class="protocol-selector" role="group" aria-label="Protocole Stratum"><button type="button" class="selected" data-protocol="v1" aria-pressed="true">Stratum V1</button><button type="button" data-protocol="v2" aria-pressed="false">Stratum V2</button></div><p id="protocol-note" class="protocol-note" hidden></p><div class="endpoint-block">
          <dl class="endpoint-fields">
            <div class="endpoint-field"><dt>Adresse</dt><dd><code id="endpoint-host">stratum.bdl-pool.com</code><button type="button" id="copy-host" class="icon-button" aria-label="Copier l’adresse du serveur"><svg class="icon"><use href="#i-copy"/></svg></button></dd></div>
            <div class="endpoint-field"><dt>Port</dt><dd><code id="endpoint-port">39991</code><button type="button" id="copy-port" class="icon-button" aria-label="Copier le port"><svg class="icon"><use href="#i-copy"/></svg></button></dd></div>
            <div class="endpoint-field endpoint-key" id="endpoint-key-row" hidden><dt>Clé publique</dt><dd><code id="endpoint-key">—</code><button type="button" id="copy-key" class="icon-button" aria-label="Copier la clé publique"><svg class="icon"><use href="#i-copy"/></svg></button></dd></div>
          </dl>
          <button type="button" id="copy-url" class="endpoint-copy-url"><svg class="icon"><use href="#i-copy"/></svg><span>Copier l’URL</span></button>
        </div><div class="availability-note" id="connection-availability"><span class="dot"></span><span>État du pool non confirmé.</span></div></div>
        <form class="panel setup-form" id="miner-form" novalidate><div class="panel-heading"><h3>Réglages du mineur</h3></div><label for="btc-address"><span>Adresse Bitcoin</span></label><input id="btc-address" name="address" placeholder="bc1…, 1… ou 3…" autocomplete="off" autocapitalize="off" spellcheck="false" aria-describedby="form-error"><label for="worker-name"><span>Nom du mineur</span><span class="optional">facultatif</span></label><input id="worker-name" name="worker" placeholder="bitaxe-01" maxlength="32" autocomplete="off" spellcheck="false"><p class="form-error" id="form-error" role="alert" hidden></p><button type="submit" class="button primary form-submit"><span>Afficher les réglages</span><svg class="icon"><use href="#i-arrow"/></svg></button><div id="miner-result" class="miner-result" hidden><div class="result-heading"><strong>À copier dans le mineur</strong><button type="button" class="icon-button" id="copy-settings" aria-label="Copier tous les réglages"><svg class="icon"><use href="#i-copy"/></svg></button></div><dl><div><dt>URL Stratum</dt><dd id="result-url"></dd></div><div><dt>Adresse</dt><dd id="result-host"></dd></div><div><dt>Port</dt><dd id="result-port"></dd></div><div id="result-key-row" hidden><dt>Clé publique de chiffrement</dt><dd id="result-key"></dd></div><div><dt>Utilisateur</dt><dd id="result-user"></dd></div><div><dt>Mot de passe</dt><dd id="result-password">x</dd></div></dl></div></form>
      </div>
    </section>
