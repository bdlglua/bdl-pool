<section class="connection-section wrap category-page" id="connexion" aria-labelledby="connection-title">
      <div class="section-heading"><div><h1 id="connection-title">Connection</h1></div></div>
      <div class="connection-grid">
        <div class="panel endpoint-panel"><div class="panel-heading"><h3>Stratum</h3></div><div class="protocol-selector" role="group" aria-label="Stratum protocol"><button type="button" class="selected" data-protocol="v1" aria-pressed="true">Stratum V1</button><button type="button" data-protocol="v2" aria-pressed="false">Stratum V2</button></div><p id="protocol-note" class="protocol-note" hidden=""></p><div class="endpoint-block">
          <dl class="endpoint-fields">
            <div class="endpoint-field"><dt>Address</dt><dd><code id="endpoint-host">stratum.bdl-pool.com</code><button type="button" id="copy-host" class="icon-button" aria-label="Copy server address"><svg class="icon"><use href="#i-copy"></use></svg></button></dd></div>
            <div class="endpoint-field"><dt>Port</dt><dd><code id="endpoint-port">39991</code><button type="button" id="copy-port" class="icon-button" aria-label="Copy port"><svg class="icon"><use href="#i-copy"></use></svg></button></dd></div>
            <div class="endpoint-field endpoint-key" id="endpoint-key-row" hidden=""><dt>Public encryption key</dt><dd><code id="endpoint-key">—</code><button type="button" id="copy-key" class="icon-button" aria-label="Copy public key"><svg class="icon"><use href="#i-copy"></use></svg></button></dd></div>
          </dl>
          <button type="button" id="copy-url" class="endpoint-copy-url"><svg class="icon"><use href="#i-copy"></use></svg><span>Copy full URL</span></button>
        </div><div class="availability-note" id="connection-availability"><span class="dot"></span><span>Pool status unconfirmed.</span></div></div>
        <form class="panel setup-form" id="miner-form" noValidate=""><div class="panel-heading"><h3>Miner settings</h3></div><label for="btc-address"><span>Bitcoin address</span></label><input id="btc-address" placeholder="bc1…, 1… or 3…" autoComplete="off" autoCapitalize="off" spellCheck="false" aria-describedby="form-error" name="address"/><label for="worker-name"><span>Worker name</span><span class="optional">optional</span></label><input id="worker-name" placeholder="bitaxe-01" maxLength="32" autoComplete="off" spellCheck="false" name="worker"/><p class="form-error" id="form-error" role="alert" hidden=""></p><button type="submit" class="button primary form-submit"><span>Show settings</span><svg class="icon"><use href="#i-arrow"></use></svg></button><div id="miner-result" class="miner-result" hidden=""><div class="result-heading"><strong>Copy into your miner</strong><button type="button" class="icon-button" id="copy-settings" aria-label="Copy all settings"><svg class="icon"><use href="#i-copy"></use></svg></button></div><dl><div><dt>Stratum URL</dt><dd id="result-url"></dd></div><div><dt>Address</dt><dd id="result-host"></dd></div><div><dt>Port</dt><dd id="result-port"></dd></div><div id="result-key-row" hidden=""><dt>Public encryption key</dt><dd id="result-key"></dd></div><div><dt>Username</dt><dd id="result-user"></dd></div><div><dt>Password</dt><dd id="result-password">x</dd></div></dl></div></form>
      </div>
    </section>
