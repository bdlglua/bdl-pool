<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="generator" content="bdl-pool-site (Rust)">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{canonical}}">
<link rel="alternate" hreflang="fr" href="{{french_url}}">
<link rel="alternate" hreflang="en" href="{{english_url}}">
<link rel="alternate" hreflang="x-default" href="{{french_url}}">
<link rel="icon" href="/assets/brand.svg" type="image/svg+xml">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#141415">
<script>try{document.documentElement.dataset.theme=localStorage.getItem('bdl-pool:theme')==='light'?'light':'dark'}catch{document.documentElement.dataset.theme='dark'}</script>
{{styles}}
{{scripts}}
</head>
<body data-page="{{page}}" data-home="{{home}}" data-legacy="{{legacy}}">
{{layout}}
</body>
</html>
