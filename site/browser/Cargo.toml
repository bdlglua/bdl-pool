[package]
name = "bdl-pool-browser"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "=0.2.105"
wasm-bindgen-futures = "=0.4.55"
js-sys = "=0.3.82"
serde_json = "1"
regex = "1"
web-sys = { version = "=0.3.82", features = ["Window", "Document", "Element", "HtmlElement", "HtmlInputElement", "HtmlSelectElement", "HtmlButtonElement", "HtmlCanvasElement", "CanvasRenderingContext2d", "DomTokenList", "DomRect", "Node", "NodeList", "Event", "EventTarget", "KeyboardEvent", "FocusEvent", "Storage", "Location", "History", "Url", "UrlSearchParams", "Request", "RequestInit", "RequestCache", "RequestCredentials", "Response", "AbortSignal", "AbortController", "Navigator", "Clipboard", "MediaQueryList", "CssStyleDeclaration", "console", "HtmlImageElement", "MessageEvent", "WebSocket", "Blob", "File", "FileReader", "HtmlTextAreaElement"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
