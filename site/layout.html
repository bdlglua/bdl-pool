<!doctype html>
<html lang="$lang">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#080f16">
  <meta name="description" content="$description">
  <title>$title</title>
  <link rel="canonical" href="https://bdl-pool.com$path">
  <link rel="alternate" hreflang="fr" href="https://bdl-pool.com$fr_path">
  <link rel="alternate" hreflang="en" href="https://bdl-pool.com$en_path">
  <link rel="alternate" hreflang="x-default" href="https://bdl-pool.com$fr_path">
  <link rel="icon" type="image/svg+xml" sizes="any" href="/assets/brand.svg">
  <script src="$theme_script"></script>
$styles
$scripts
</head>
<body data-page="$page" data-home="$home_path" data-legacy="$legacy">
$icons
  <a class="skip-link" href="#main">$skip</a>
$header
  <main id="main" class="$main_class">
$content
  </main>
$footer
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <noscript><p class="noscript-message">$noscript</p></noscript>
</body>
</html>
